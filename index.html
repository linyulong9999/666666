<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 GitHub 网站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">GitHub Pages</p>
      <h1>欢迎来到我的网站</h1>
      <p class="intro">
        这是一个已经可以发布到 GitHub Pages 的静态网页。你可以继续修改文字、颜色和内容，把它变成自己的作品展示页。
      </p>
      <div class="actions">
        <a class="button primary" href="https://github.com/linyulong9999/666666" target="_blank" rel="noreferrer">查看仓库</a>
        <a class="button" href="#content">了解更多</a>
      </div>
    </section>

    <section id="content" class="content">
      <article>
        <h2>关于这个页面</h2>
        <p>网页首页文件是 <strong>index.html</strong>。GitHub Pages 会默认读取这个文件并显示网站。</p>
      </article>
      <article>
        <h2>下一步可以做什么</h2>
        <p>你可以添加图片、个人介绍、项目链接，或者把它改成产品展示、博客首页、课程作业页面。</p>
      </article>
      <article>
        <h2>发布方式</h2>
        <p>提交并推送到 GitHub 后，在仓库的 Settings > Pages 里选择 main 分支即可发布。</p>
      </article>
    </section>
  </main>
</body>
</html>
